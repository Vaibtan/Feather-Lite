[project]
name = "backend"
version = "0.1.0"
description = "Feather-Lite backend runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "livekit-agents[silero,turn-detector]>=1.5.0,<1.6.0",
    "livekit-api>=1.1.0",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[project.scripts]
feather-lite-api = "app.main:run"
feather-lite-agent = "app.voice.agent_runtime:run"
feather-lite-outbox-worker = "app.workers.outbox_worker:main"
feather-lite-scheduled-actions-worker = "app.workers.scheduled_action_worker:main"
seed-demo = "app.seed:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
