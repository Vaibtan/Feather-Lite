name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/feather_lite
    steps:
      - uses: actions/checkout@v4
      # Not a `services:` container. A service container's command cannot be overridden, and
      # `pg_stat_statements` has to be preloaded at server start (`shared_preload_libraries`) — so
      # CI was running the one Postgres shape the product had never been booted against, and
      # migration 0005's `CREATE EXTENSION` failed there. Composing the repo's own Postgres means
      # CI runs the flags the load reports are measured with, and there is one definition of them.
      - name: Start Postgres (the same one docker-compose defines)
        run: |
          docker compose up -d --wait postgres
          # Asserted, not printed. Dropping the flag would degrade migration 0005 to its warning
          # path silently, and the statement ranking every load claim rests on would quietly vanish.
          docker compose exec -T postgres psql -U postgres -d feather_lite -tAc "SHOW shared_preload_libraries" | grep -q pg_stat_statements
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @feather-lite/control-plane test:db
