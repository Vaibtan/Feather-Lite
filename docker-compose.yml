# Local Postgres for development and DB-backed tests, an optional self-hosted LiveKit SFU, and the
# two application images.
#   docker compose up -d                                  # Postgres only (pnpm db:up)
#   docker compose --profile livekit up -d livekit        # + LiveKit media server (pnpm lk:up)
#   docker compose --profile livekit --profile app up -d --build   # + server and worker as images
#   DATABASE_URL=postgres://postgres:postgres@localhost:5434/feather_lite
services:
  postgres:
    image: postgres:16-alpine
    container_name: feather-lite-postgres
    # `pg_stat_statements` must be preloaded at server start; it cannot be turned on by a migration.
    # It is what turns "43 round trips per turn" into a ranked list of statements, so every D5
    # change is a measured delta per statement rather than a wall-clock guess (spec D5b). The
    # extension itself is created by migration 0006, which is a no-op without this line.
    # Sized for the 512 MB this container is given, and instrumented (spec D5b). Passed as `-c`
    # flags rather than a mounted postgresql.conf: mounting one *replaces* the image's file
    # entirely, so a fragment that forgot `listen_addresses` would produce a container that starts
    # and cannot be connected to. Flags compose with the defaults and are visible right here.
    #
    # `synchronous_commit` is deliberately absent, which means it stays `on`. The ledger is this
    # product's durability claim (ADR 0001/0003); a 1-2 ms fsync per commit is not the bottleneck
    # (the statement ranking says the whole run spends ~850 ms in Postgres) and turning it off is
    # the one Postgres change this spec forbids.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=2000
      -c pg_stat_statements.track=top
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c wal_compression=on
      -c checkpoint_completion_target=0.9
      -c max_wal_size=1GB
      -c random_page_cost=1.1
      -c jit=off
      -c log_min_duration_statement=250ms
      -c track_io_timing=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feather_lite
    # It peaked at 261 MB and 88 % of a core through a 30 turns/s soak, so 512 MB is headroom
    # rather than a squeeze — and a ceiling that exists is what stops it competing with the voice
    # worker for the last gigabyte on a laptop.
    mem_limit: 512m
    ports:
      - "5434:5432"
    volumes:
      - feather_lite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feather_lite"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Self-hosted media server: the Cloud/local swap is an .env change (LIVEKIT_URL/KEY/SECRET), not a
  # code change. See deploy/livekit/livekit.yaml and docs/adr/0006.
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: feather-lite-livekit
    profiles: ["livekit"]
    # The address the SFU advertises as its ICE candidate, which decides who can reach the media.
    #
    # `127.0.0.1` is right for the browser demo and **wrong for anything in a container**: a worker
    # in another container that dials 127.0.0.1 reaches itself. That is why "a container-to-container
    # voice call is not verified" has been on the README's Not-built list — signalling and dispatch
    # worked, media could not.
    #
    # Set `LIVEKIT_NODE_IP` to a host address that both sides can reach — the machine's LAN address
    # works from the host directly and from inside Docker Desktop's VM, because the media ports are
    # published on the host. Then a containerised worker and a harness on either side of the boundary
    # both get a usable candidate. Default unchanged, so the demo path is untouched.
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    # Measured at 53 MB and 15 % of a core at N=5, so neither number is a squeeze. `cpus` is the
    # one that matters: media forwarding is latency-critical and must not be the thing a runaway
    # job process starves, so it gets two of the twelve reserved from the other direction.
    cpus: 2
    mem_limit: 512m
    ports:
      - "7880:7880" # signalling / server API (ws://127.0.0.1:7880)
      - "7881:7881" # ICE over TCP fallback
      - "7882:7882/udp" # single-port UDP mux for all media
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7880"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------- app ----
  # The deployable unit (spec D6, Q1). `--profile app` runs the two production images against the
  # same Postgres and SFU the native processes use, so a containerised run can be compared with a
  # native one on the same box rather than on a different one.
  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: feather-lite-server:local
    container_name: feather-lite-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/feather_lite
      # Everything else comes from the repo-root .env, so a container run and a native run are
      # configured from one file. Nothing here has a default that would quietly differ from it.
      TURN_DECIDER: ${TURN_DECIDER:-scripted}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      JUDGE_ENABLED: ${JUDGE_ENABLED:-false}
      # Signalling over the compose network, not from `.env`: the repo-root value is
      # `ws://127.0.0.1:7880` for a native run, and inside this container that is this container.
      # The server only needs the SFU to create rooms and dispatch agents; the participant token it
      # hands back carries no URL, so the caller still connects on whatever address it can reach.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_BYPASS_TOKEN: ${RATE_LIMIT_BYPASS_TOKEN:-}
      DAILY_TURN_CAP: ${DAILY_TURN_CAP:-5000}
      # Unset by default, as it has always been. It is listed on **both** this service and the
      # worker because it only works as a pair: the worker authenticates every request it makes,
      # so a token reaching the server and not the worker would 401 the turn stream and - since
      # C2 - the heartbeat too, and the sweeper would then orphan calls that were being served.
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      # Unset on the self-hosted profile, which has no SIP at all. The control plane reads it to
      # answer a question it used to guess at: whether a scheduled voice re-dial has anywhere to
      # dial. Without it every unanswered call was re-dialled over a trunk that does not exist,
      # burning a room, a dispatch and a worker job slot per lap (C4).
      LIVEKIT_SIP_OUTBOUND_TRUNK_ID: ${LIVEKIT_SIP_OUTBOUND_TRUNK_ID:-}
    mem_limit: 768m
    ports:
      - "8080:8080"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/voice-worker/Dockerfile
      # **Explicit since the harness stage was added** (issue #4, Phase D). A build with no `target`
      # takes the *last* stage in the file, so appending `harness` silently turned this service into
      # the harness image — same tag, no `dist/`, exit 0 with no log line at all.
      target: runtime
    image: feather-lite-worker:local
    container_name: feather-lite-worker
    depends_on:
      server:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: http://server:8080
      # Signalling to the SFU over the compose network. **Media is a separate question** and it is
      # answered by `LIVEKIT_NODE_IP` on the `livekit` service above: with the default `127.0.0.1`
      # the SFU advertises a candidate that this container cannot reach, and the call connects and
      # then hears nothing. Set it to a host address both sides can reach before running anything
      # through here.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-feather-lite-agent}
      STT_TTS_PROVIDER: ${STT_TTS_PROVIDER:-plugins}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-asteria-en}
      # Eight, and 3 GB genuinely carries eight — but only since W11.
      #
      # It was briefly four. The arithmetic then came from host measurements of a worker running the
      # Silero plugin (a warm slot 194 MB, a call adding 300), which put eight calls at 4.4 GB
      # against a 3 GB cgroup: the kernel would have killed the worker and every call on it under
      # exactly the N=10 load the acceptance bar names. With the native VAD, measured *in this
      # container*, the same eight fit. `apps/load-test/test/composeLimits.test.ts` asserts the
      # inequality from the container numbers, so the two cannot drift apart silently again.
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-8}
      WORKER_IDLE_PROCESSES: ${WORKER_IDLE_PROCESSES:-4}
      WORKER_JOB_MEMORY_WARN_MB: ${WORKER_JOB_MEMORY_WARN_MB:-400}
      WORKER_JOB_MEMORY_LIMIT_MB: ${WORKER_JOB_MEMORY_LIMIT_MB:-800}
      RATE_LIMIT_BYPASS_TOKEN: ${RATE_LIMIT_BYPASS_TOKEN:-}
      # The other half of the pair on the server service above. The worker presents this on the
      # turn stream, on signals and on the heartbeat.
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      # The worker has always read this; it is listed now so it and the server agree about whether
      # an outbound call can be placed at all (C4).
      LIVEKIT_SIP_OUTBOUND_TRUNK_ID: ${LIVEKIT_SIP_OUTBOUND_TRUNK_ID:-}
      # `vad` unless told otherwise, because `vad` is what this profile runs: adaptive interruption
      # is LiveKit's hosted detector and self-hosted has no credentials for it (W1). Set `adaptive`
      # on a Cloud deployment.
      WORKER_INTERRUPTION_MODE: ${WORKER_INTERRUPTION_MODE:-vad}
      # The point at which this worker asks the SFU to prefer another one. Listed because the
      # admitted concurrency is `floor(WORKER_MAX_JOBS x this)`, not `WORKER_MAX_JOBS` — the
      # arithmetic the N=10 acceptance run walked into — and `composeLimits.test.ts` reads it from
      # here so the test and the deployment cannot drift apart (W5).
      WORKER_LOAD_THRESHOLD: ${WORKER_LOAD_THRESHOLD:-0.75}
    # The arithmetic, from `docker stats` on this container rather than from host processes — which
    # is the only honest source now that the worker only ever runs here (2026-09-01, W11):
    #
    #   idle, four warm slots, native VAD                        = 1093 MB  fixed
    #   a concurrent call, measured at N=5 (2018-2095 peak)      =  ~200 MB  per call
    #   with a 20 % margin on the per-call figure                =   240 MB
    #   1093 + 8 x 240                                           = 3013 MB  at WORKER_MAX_JOBS=8
    #   1093 + 14 x 240                                          = 4453 MB  at WORKER_MAX_JOBS=14
    #
    # **5 GB, because serving ten calls means a ceiling of fourteen.** `WORKER_MAX_JOBS` is not the
    # concurrency the SFU will actually assign: `loadFunc` reports `activeJobs / WORKER_MAX_JOBS`
    # and the SFU stops assigning at `load >= WORKER_LOAD_THRESHOLD` (0.75), so the ceiling and the
    # served concurrency differ by the margin the threshold exists for. `agent.ts` says so beside
    # the constant — "the admitted concurrency is floor(MAX_JOBS * THRESHOLD) — 6 at the defaults,
    # not 8 … reaching [ten] means raising WORKER_MAX_JOBS".
    #
    # **Measured, on the first N=10 attempt (2026-09-01):** `WORKER_MAX_JOBS=10` started **nine**
    # jobs for ten calls. The tenth was never assigned — nine active reports a load of 0.9 — and it
    # finalized `FAILED / NEVER_SERVED`, which is the shed path working correctly against a ceiling
    # that was set too low. The same run confirmed the per-call term exactly: 2 917 MB peak with
    # nine calls on a 755 MB idle tree is (2917 - 755) / 9 = 240 MB a call.
    #
    # The default concurrency stays **8**: the acceptance run overrides it, and what ten calls do on
    # this box is what that run is for. `mem_limit` is a cap and not a reservation, so the headroom
    # costs nothing until it is used — but it has to cover the ceiling the worker will actually
    # accept, or the ceiling is a number that OOM-kills the container it was supposed to protect.
    #
    # The fixed term is the whole reason W11 mattered: with the Silero plugin the same idle tree was
    # 1651 MB, and `onnxruntime-node` was 513 MB of binaries hand-pruned in the Dockerfile.
    mem_limit: 5g

  # ------------------------------------------------------------------ harness
  #
  # The borrower harness (issue #4, Phase D / decision R2).
  #
  # It was the last piece of the system on the host, and it is the piece that decides whether every
  # number is comparable: a measurement whose measurer sits on the other side of the NAT is not the
  # same measurement as one taken beside the thing measured.
  #
  # Its own profile, because it is not part of the running system — it is a thing you run *at* the
  # running system, and `--profile app` must not start a load generator.
  #
  #   pnpm loadtest:tier2:docker -- --calls 5 --label n5-container
  #
  # The root scripts pass `--build`, and that is not politeness. This image is a **snapshot of the
  # sources** (`COPY --from=build /repo /repo`), so without it a `run` measures whatever the image
  # was built from — which happened once already: an H6 run wrote its report under the old filename
  # because the container was still on the previous commit, and nothing said so.
  harness:
    profiles: ["harness"]
    build:
      context: .
      dockerfile: apps/voice-worker/Dockerfile
      target: harness
    image: feather-lite-harness:local
    container_name: feather-lite-harness
    depends_on:
      worker:
        condition: service_healthy
    environment:
      # Compose-network addresses, not the repo `.env`'s: inside here `127.0.0.1` is this container.
      CONTROL_PLANE_URL: http://server:8080
      # P5: tier 1 read `LOAD_TEST_API` for the same thing the fleet reads `CONTROL_PLANE_URL` for.
      # Both are set to the same value so neither arm can drift; the code now prefers the latter.
      LOAD_TEST_API: http://server:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/feather_lite
      # **Signalling only.** Media is answered by `LIVEKIT_NODE_IP` on the `livekit` service: the SFU
      # advertises that candidate to everyone, and this container reaches the host address the same
      # way the worker does. R3 keeps it the host LAN address for Phase D's first run; `rtc.addresses`
      # is a later trial.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      STT_TTS_PROVIDER: ${STT_TTS_PROVIDER:-plugins}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-asteria-en}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The same secret the server has, or the run is shed by its own middleware (O9).
      RATE_LIMIT_BYPASS_TOKEN: ${RATE_LIMIT_BYPASS_TOKEN:-}
    # The socket inside the Docker Desktop VM is `root:root` mode 660, so a non-root user needs group
    # 0 to read it. The container still *runs* as `node` — no root-owned files, no privileged
    # operations — and the socket is mounted read-only; this is read access to it and nothing more.
    # Without it the sampler silently falls back to procfs, which inside a container sees only this
    # container's own namespace, and the per-core budget disappears from exactly the runs it is
    # defined on. `validateReport` now refuses a report that claims a container basis it does not
    # have, but the group is what makes the basis real.
    group_add: ["0"]
    volumes:
      # Read-only: the sampler reads container memory and CPU through the CLI and never writes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Reports land in the repo, so a containerised run is as reviewable as a host one.
      - ./docs/loadtest:/repo/docs/loadtest
      # The synthesised borrower lines, so a second run does not re-synthesise them — and so the two
      # arms of Phase D's comparison speak byte-identical audio.
      - ./apps/voice-worker/.cache:/repo/apps/voice-worker/.cache
    working_dir: /repo
    # `tsx` directly rather than through `pnpm`, because `pnpm run` verifies the dependency tree
    # before every script and writes a temp file into `/repo` to do it — which this container runs as
    # `node` and cannot write, and which would re-resolve `--production` and drop the very dev
    # dependency (`tsx`) the harness runs on. The only paths written here are the two bind mounts.
    entrypoint: ["/repo/node_modules/.bin/tsx"]
    command: ["apps/voice-worker/src/tracer/fake-borrower-fleet.ts"]

volumes:
  feather_lite_pg:
